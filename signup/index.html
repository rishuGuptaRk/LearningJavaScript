<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="background">
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <div id="stack">
            <div id="content">
                <H1 id="sign">Sign Up</H1>
                <h1 id="main-heading"> JOIN DEDSEC COMMUNITY </h1>
                <h2 id="register">Register to Download DEDSEC APP</h2>
                <p>Name: <input type="text" name="name" id="name"></p>
                    <p>Email: <input type="email"></p>
                    <p>Phone: <input type="number" name="ph" id="ph"></p>
                    <fieldset>
                        <legend>GENDER</legend>
                        <p>
                        <input type="radio" name="" id="">Male
                        <input type="radio" name="" id="">Female
                        </p>
                        </fieldset>
                        
                        <p>Address: <br><textarea name="address" id="location" cols="30" rows="10"></textarea></p>
 
                    <h2>Payment Details</h2>
                    <br>
                    <select name="card" id="card">
                            <p>Card Type: 
                            <option value="1">VISA</option>
                            <option value="0">Select card</option>
                            <option value="3">RUPAY</option>
                            <option value="2">MASTERCARD</option>
                        </p>
                    </select>
                    <p>CVV: <input type="number" name="cvv" id="cvv" maxlength="3"></p>
                    <p>Credit/Debit Card Number: <input type="number" name="card_number" id="card_number" maxlength="16" placeholder="16 Digits Number"></p>

                    <p>EXPIRY DATE: <input type="date" name="" id=""></p>                <br>

                    <div>

                        <Button type="reset">Reset</Button>
                        <Button type="submit">Submit</Button>
                    </div>
                </div>
            </div>
    </div>
</body>
</html>
