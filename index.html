<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video.js Local File Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Video.js CSS -->
  <link href="https://vjs.zencdn.net/8.23.3/video-js.css" rel="stylesheet" />
  <style>
    body {
      background: #222;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .video-container {
      width: 80%;
      max-width: 800px;
    }
    .file-label {
      margin-top: 15px;
      padding: 10px 20px;
      background: #1db954;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .file-label:hover {
      background: #17a444;
    }
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Video.js — Local File Player</h1>

  <div class="video-container">
    <video
      id="my-video"
      class="video-js vjs-big-play-centered"
      controls
      preload="auto"
      width="640"
      height="360"
      data-setup="{}"
    >
      <source src="" type="video/mp4" />
      <p class="vjs-no-js">
        To view this video please enable JavaScript, and consider upgrading to a
        web browser that supports HTML5 video.
      </p>
    </video>

    <label class="file-label" for="videoFile">Select Video File</label>
    <input type="file" id="videoFile" accept="video/*">
  </div>

  <!-- Video.js JS -->
  <script src="https://vjs.zencdn.net/8.23.3/video.min.js"></script>
  <script>
    const player = videojs('my-video');
    const fileInput = document.getElementById('videoFile');

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        player.src({ src: fileURL, type: file.type });
        player.ready(function() {
          player.play().catch(function(err){
            console.error('Autoplay prevented or error:', err);
          });
        });
      }
    });
  </script>
</body>
</html>
